<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Projeto ECAM</h2>
    
    <form (ngSubmit)="fazerLogin()">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Login</label>
        <input 
          type="text" 
          name="usuario"
          [(ngModel)]="usuario" 
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Digite seu usuário"
          required>
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
        <input 
          type="password" 
          name="senha"
          [(ngModel)]="senha" 
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Digite sua senha"
          required>
      </div>

      <div *ngIf="mensagemErro" class="text-red-500 text-sm text-center mb-4">
        {{ mensagemErro }}
      </div>

      <button 
        type="submit" 
        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
        Entrar
      </button>
    </form>
  </div>
</div>
