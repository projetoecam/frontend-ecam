<div class="p-6 bg-white rounded-2xl shadow-sm border border-slate-200">
  <h2 class="text-2xl font-bold text-slate-900 mb-6">Configurações de Acesso</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- Lista de Perfis (Lado Esquerdo) -->
    <div class="col-span-1 border-r border-slate-100">
      <h3 class="font-semibold text-slate-700 mb-4 px-2">Perfis do Sistema</h3>
      <div class="space-y-2">
        <button *ngFor="let p of perfis" 
                (click)="selecionarPerfil(p)"
                [class.bg-indigo-50]="perfilSelecionado?.id === p.id"
                [class.text-indigo-700]="perfilSelecionado?.id === p.id"
                class="w-full text-left px-4 py-3 rounded-lg hover:bg-slate-50 transition border border-transparent font-medium text-slate-600">
          {{ p.nome }}
        </button>
      </div>
    </div>

    <!-- Gestão de Permissões (Lado Direito) -->
    <div class="col-span-2" *ngIf="perfilSelecionado; else selecionePerfil">
      <div class="mb-6">
        <h3 class="text-lg font-semibold text-slate-900">Permissões: {{ perfilSelecionado.nome }}</h3>
        <p class="text-sm text-slate-500">Marque as ações permitidas para este perfil:</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label *ngFor="let perm of todasPermissoes" 
               class="flex items-center p-4 border rounded-lg hover:border-indigo-300 hover:bg-indigo-50/30 cursor-pointer transition">
          <input type="checkbox" 
                 [checked]="temPermissao(perm.nome)"
                 (change)="togglePermissao(perm, $event)"
                 class="w-5 h-5 text-indigo-600 focus:ring-indigo-500 rounded border-slate-300">
          <div class="ml-3">
            <p class="font-medium text-sm text-slate-800">{{ perm.nome }}</p>
            <p class="text-xs text-slate-400">{{ perm.descricao }}</p>
          </div>
        </label>
      </div>
    </div>

  </div>
</div>

<!-- Placeholder caso nenhum perfil esteja selecionado -->
<ng-template #selecionePerfil>
  <div class="col-span-2 flex flex-col items-center justify-center h-64 text-slate-400 border-2 border-dashed rounded-lg bg-slate-50">
    <svg class="w-12 h-12 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
    <p>Selecione um perfil à esquerda para gerir as suas permissões.</p>
  </div>
</ng-template>
